plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "aivillageinspector" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// Auto-increment the lower (patch) version in gradle.properties
import java.util.Properties

def gradlePropertiesFile = file('gradle.properties')

task incrementModVersion {
    description = 'Increment the patch (last) number of mod_version in gradle.properties and update project.version'
    doLast {
        if (!gradlePropertiesFile.exists()) {
            println "gradle.properties not found at ${gradlePropertiesFile}", "Skipping version increment"
            return
        }
        def props = new Properties()
        gradlePropertiesFile.withInputStream { stream -> props.load(stream) }
        def current = props.getProperty('mod_version') ?: project.version.toString()
        println "Current mod_version: ${current}"
        def parts = current.tokenize('.')
        if (parts.size() == 0) {
            println "Could not parse version '${current}' - expected dot-separated numbers"
            return
        }
        // Try to increment the last numeric segment, if non-numeric append .1
        def lastIndex = parts.size() - 1
        try {
            def lastNum = parts[lastIndex].toInteger()
            lastNum = lastNum + 1
            parts[lastIndex] = lastNum.toString()
        } catch (NumberFormatException e) {
            // If last segment isn't numeric, append .1
            parts << '1'
        }
        def newVersion = parts.join('.')
        props.setProperty('mod_version', newVersion)
        gradlePropertiesFile.withOutputStream { out -> props.store(out, null) }
        project.version = newVersion
        println "mod_version bumped to ${newVersion}"
    }
}

// A small helper task to print the current version(s)
task printVersion {
    description = 'Print project.version and mod_version from gradle.properties (useful for testing increment)'
    dependsOn incrementModVersion
    doLast {
        def modVer = project.findProperty('mod_version') ?: 'undefined'
        println "project.version=${project.version}"
        println "mod_version (file)=${modVer}"
    }
}

// Ensure resources are processed with the incremented version for builds
processResources.dependsOn(incrementModVersion)
